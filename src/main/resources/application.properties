spring.application.name=learnhub-ai
server.address=127.0.0.1
server.port=${APP_PORT:8088}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=11MB
server.tomcat.max-part-count=3
server.tomcat.connection-timeout=15s
spring.datasource.url=jdbc:h2:file:${APP_DATA_DIR:./data}/learnhub;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=0
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.log-resolved-exception=false
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
app.access-token=${APP_ACCESS_TOKEN:}
app.embedding-api-base-url=${EMBEDDING_API_BASE_URL:}
app.embedding-api-key=${EMBEDDING_API_KEY:}
app.embedding-model=${EMBEDDING_MODEL:}
app.chat-api-base-url=${CHAT_API_BASE_URL:}
app.chat-api-key=${CHAT_API_KEY:}
app.chat-model=${CHAT_MODEL:}
